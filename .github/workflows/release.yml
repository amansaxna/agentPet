name: Multi-Platform Release

# Builds both macOS (.dmg) and Windows (.exe, .msi, .zip) installers in parallel
# and attaches all binaries directly to the GitHub Release.
# Triggered automatically on push of a `v*` tag, or manually via "Run workflow".
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish to (e.g. v1.18.1)'
        required: true
        default: 'v1.18.1'
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Import Developer ID certificate
        if: ${{ env.CERT != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}

      - name: Build DMG (sign + notarize if secrets present)
        run: ./scripts/ci-dmg.sh
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}

      - name: Attach macOS DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: build/*.dmg
          token: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Build Windows Installers
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (msi + nsis)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [[ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]]; then
            npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npm run tauri build
          fi

      - name: Package portable exe (for Scoop)
        shell: pwsh
        run: Compress-Archive -Path src-tauri/target/release/agentpet.exe -DestinationPath AgentPet-portable-x64.zip -Force

      - name: Attach Windows Installers to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            windows/src-tauri/target/release/bundle/nsis/*-setup.exe
            windows/src-tauri/target/release/bundle/msi/*.msi
            windows/AgentPet-portable-x64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
